name: CI Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Mock API keys for testing - these are NOT real keys
      GEMINI_API_KEY: test-mock-key-for-ci
      API_KEY: test-mock-key-for-ci

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build
      env:
        GEMINI_API_KEY: mock-key-for-build

    - name: Type check
      run: npm run type-check
      continue-on-error: true

    - name: Run tests
      run: npm test -- --run
      continue-on-error: true
